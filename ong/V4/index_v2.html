<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Adopción - Refugio de Perritos</title>
    <style>
        /* --- ESTILOS (CSS) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #2ecc71;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        /* Mensaje de éxito escondido por defecto */
        .mensaje-exito {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Formulario de Adopción 🐾</h2>
        <p class="subtitle">Completá tus datos para conocer a tu próximo mejor amigo.</p>

        <form id="formularioAdopcion">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="juan@example.com" required>
            </div>

            <div class="form-group">
                <label for="perrito">¿En qué tipo de perrito estás interesado?</label>
                <select id="perrito" required>
                    <option value="" disabled selected>Seleccioná una opción</option>
                    <option value="cachorro">Cachorro (Menos de 1 año)</option>
                    <option value="adulto">Adulto (1 a 7 años)</option>
                    <option value="senior">Senior (Más de 7 años)</option>
                    <option value="indiferente">Cualquiera, ¡quiero dar amor!</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensaje">¿Por qué te gustaría adoptar? (Opcional)</label>
                <textarea id="mensaje" placeholder="Contanos un poco sobre el hogar que le vas a ofrecer..."></textarea>
            </div>

            <button type="submit">Enviar Solicitud</button>
        </form>

        <div id="mensajeExito" class="mensaje-exito">
            ¡Muchas gracias! Recibimos tu solicitud. Nos contactaremos pronto de forma interna. 🐶
        </div>
    </div>

    <script>
        document.getElementById('formularioAdopcion').addEventListener('submit', function(event) {
            // Evita que la página se recargue al tocar el botón enviar
            event.preventDefault();

            // Obtenemos los valores de los campos
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const perrito = document.getElementById('perrito').value;

            // Validación simple en JS por si falla la nativa del navegador
            if(nombre === '' || email === '' || perrito === '') {
                alert('Por favor, completá todos los campos obligatorios.');
                return;
            }

            // Si todo está bien, simulamos el envío:
            // Escondemos el formulario
            document.getElementById('formularioAdopcion').style.display = 'none';
            
            // Mostramos el cartel de éxito
            const cartel = document.getElementById('mensajeExito');
            cartel.style.display = 'block';
        });
    </script>

</body>
</html>
